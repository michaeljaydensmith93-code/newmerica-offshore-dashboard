<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tax Account Detail</title>
	<style>
		:root{--bg:#07110f;--panel:#0d1d19;--line:#285344;--text:#edf7ef;--muted:#91b2a1;--gold:#e8c878;--green:#62d39b;--red:#f28b7d}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07110f,#101e18);color:var(--text);font:15px/1.5 Georgia,serif}.wrap{width:min(1180px,100%);margin:auto;padding:28px 20px 48px}.masthead{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font:700 11px/1.2 monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0 0;font-size:clamp(2rem,5vw,4rem);font-weight:400}.subtitle{color:var(--muted)}.button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:9px 14px;border-radius:4px;text-decoration:none;font:700 12px monospace;text-transform:uppercase}.status{margin:20px 0;padding:10px 14px;border-left:3px solid var(--green);background:rgba(98,211,155,.08);color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.fact{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:4px}.fact label{display:block;color:var(--muted);font:11px monospace;text-transform:uppercase}.fact strong{display:block;margin-top:4px;font:700 1.15rem monospace}.money{color:var(--green)}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid rgba(40,83,68,.6)}th{color:var(--gold);font:700 11px monospace;text-transform:uppercase}td{color:#d7e8da}.empty{color:var(--muted);padding:16px}@media(max-width:760px){.masthead{align-items:start;flex-direction:column}.facts{grid-template-columns:repeat(2,1fr)}}
	</style>
</head>
<body>
	<main class="wrap">
		<header class="masthead"><div><div class="eyebrow">Tax ledger // individual account</div><h1 id="title">Tax Account</h1><p class="subtitle">All available BE&amp;T and Anri tax records associated with this tax ID.</p></div><a class="button" href="offshore-anris-cute-cat-cafe.html">Back to Café Tracker</a></header>
		<div class="status" id="status">Loading tax records...</div>
		<section class="facts"><div class="fact"><label>Tax ID</label><strong id="taxId">--</strong></div><div class="fact"><label>Member</label><strong id="member">Unknown</strong></div><div class="fact"><label>Cash total</label><strong class="money" id="cashTotal">$0</strong></div><div class="fact"><label>Records</label><strong id="recordCount">0</strong></div></section>
		<div class="table-wrap"><table><thead><tr><th>Date</th><th>From</th><th>To</th><th>Cash</th><th>Resources</th><th>Note</th></tr></thead><tbody id="records"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody></table></div>
	</main>
	<script>
		const API_KEY='6d6a8d4c6138245a70b4', BARROWS_BANK_ID=15572, ANRI_BANK_ID=15086, params=new URLSearchParams(location.search), TAX_ID=params.get('tax_id') || 'unassigned', ALLIANCE_ID=Number(params.get('alliance_id')) || BARROWS_BANK_ID, API_URL=`https://api.politicsandwar.com/graphql?api_key=${API_KEY}`;
		const RESOURCES=['food','coal','oil','uranium','iron','bauxite','lead','gasoline','munitions','steel','aluminum'], labels={food:'Food',coal:'Coal',oil:'Oil',uranium:'Uranium',iron:'Iron',bauxite:'Bauxite',lead:'Lead',gasoline:'Gasoline',munitions:'Munitions',steel:'Steel',aluminum:'Aluminum'}, $=id=>document.getElementById(id), money=value=>`$${Math.round(Number(value)||0).toLocaleString()}`, number=value=>(Number(value)||0).toLocaleString();
		const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])), api=async query=>{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(API_URL,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({query}),signal:controller.signal});const json=await response.json();if(!response.ok||json.errors?.length)throw new Error(json.errors?.[0]?.message||`HTTP ${response.status}`);return json.data;}catch(error){if(error?.name==='AbortError')throw new Error('The API request timed out. Check the connection or API availability.');throw error;}finally{clearTimeout(timeout);}};
		async function load(){try{const data=await api(`{ alliances(id: [${ALLIANCE_ID}]) { data { taxrecs(limit: 100) { id date sender_id receiver_id sender { nation_name } receiver { nation_name } money food coal oil uranium iron bauxite lead gasoline munitions steel aluminum tax_id note } } } }`);const records=(data?.alliances?.data?.[0]?.taxrecs||[]).filter(record=>String(record.tax_id??'unassigned')===TAX_ID);const memberData=await api(`{ nations(alliance_id: [${ALLIANCE_ID}], first: 500) { data { nation_name leader_name tax_id } } }`);const member=(memberData?.nations?.data||[]).find(item=>String(item.tax_id??'unassigned')===TAX_ID);let cash=0;const rows=records.map(record=>{cash+=Number(record.money)||0;const resources=RESOURCES.filter(resource=>Number(record[resource])).map(resource=>`${labels[resource]}: ${number(record[resource])}`).join(', ')||'None';return `<tr><td>${escapeHtml(record.date?new Date(record.date).toLocaleString():'Unknown')}</td><td>${escapeHtml(record.sender?.nation_name||record.sender_id||'Unknown')}</td><td>${escapeHtml(record.receiver?.nation_name||record.receiver_id||'Unknown')}</td><td>${money(record.money)}</td><td>${escapeHtml(resources)}</td><td>${escapeHtml(record.note||'No note')}</td></tr>`;}).join('');$('taxId').textContent=TAX_ID;$('title').textContent=`Tax Account ${TAX_ID}`;$('member').textContent=member?`${member.nation_name||'Unknown'} (${member.leader_name||'Unknown'})`:'Not found in current member list';$('cashTotal').textContent=money(cash);$('recordCount').textContent=number(records.length);$('records').innerHTML=rows||'<tr><td colspan="6" class="empty">No records available for this tax ID.</td></tr>';$('status').textContent=`Loaded ${records.length} available tax records for tax ID ${TAX_ID}.`;}catch(error){$('status').textContent=`Unable to load tax account: ${error.message}`;$('records').innerHTML='<tr><td colspan="6" class="empty">Tax records unavailable.</td></tr>';}}
		$('taxId').textContent=TAX_ID;load();
	</script>
</body>
</html>
