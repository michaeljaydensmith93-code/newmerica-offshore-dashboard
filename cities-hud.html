<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root { color-scheme: dark; --bg: #050816; --panel: #0e1428; --line: #24304f; --cyan: #00f0ff; --text: #f5f7ff; --muted: #7d8ca8; --green: #4ade80; --accent: #5eead4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: radial-gradient(circle at top, rgba(0,240,255,0.08), transparent 32%), var(--bg); color: var(--text); }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .panel { position: relative; background: linear-gradient(145deg, rgba(14,20,40,0.98), rgba(8,13,26,0.96)); border: 1px solid rgba(94,234,212,0.25); border-radius: 16px; padding: 22px; box-shadow: 0 0 24px rgba(0,240,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.02); }
    h1 { margin: 0 0 10px; color: var(--cyan); font-size: 1.4rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .meta { color: var(--muted); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid rgba(36,48,79,0.8); padding: 10px 8px; text-align: left; }
    th { color: var(--accent); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; background: rgba(0,240,255,0.06); }
    tbody tr { transition: background 0.2s ease; }
    tbody tr:hover { background: rgba(0,240,255,0.06); }
    .back { display: inline-block; margin-bottom: 16px; color: var(--cyan); text-decoration: none; font-weight: 600; }
    .back:hover { color: var(--accent); }
    .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; background: rgba(0,240,255,0.14); color: var(--cyan); font-size: 0.8rem; margin-right: 6px; border: 1px solid rgba(0,240,255,0.2); }
    .city-link { color: var(--cyan); text-decoration: none; cursor: pointer; font-weight: 600; }
    .city-link:hover { color: var(--accent); text-decoration: underline; }
    .summary { max-width: min(360px, calc(100% - 24px)); margin: 0 0 12px auto; padding: 8px 10px; border-radius: 10px; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.18); color: var(--green); font-weight: 600; font-size: 0.76rem; line-height: 1.35; text-align: right; z-index: 2; }
    .summary-trend { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; font-size: 0.76rem; color: var(--muted); }
    .summary-trend-badge { font-weight: 700; letter-spacing: 0.03em; }
    .summary-trend-spark { width: 90px; height: 22px; display: block; }
    .group { margin-top: 18px; padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
    .group h3 { color: var(--accent); margin: 0 0 8px; font-size: 1rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .group table { margin-bottom: 4px; }
    .city-name-stack { display: flex; flex-direction: column; gap: 4px; }
    .city-name { font-weight: 700; color: var(--text); }
    .city-trend-meta { display: flex; align-items: center; gap: 8px; font-size: 0.68rem; color: var(--muted); line-height: 1.2; margin-bottom: 2px; }
    .city-trend-badge { font-weight: 700; letter-spacing: 0.03em; }
    .city-trend-spark { width: 72px; height: 22px; display: block; }
    .group-trend { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; font-size: 0.8rem; color: var(--muted); }
    .group-trend-badge { font-weight: 700; letter-spacing: 0.03em; }
    .group-trend-spark { width: 68px; height: 18px; display: block; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .toolbar button { padding: 7px 12px; border: 1px solid rgba(0,240,255,0.2); background: rgba(0,240,255,0.12); color: var(--cyan); border-radius: 8px; cursor: pointer; font-weight: 600; }
    .toolbar button:hover { background: rgba(0,240,255,0.2); }
    .war-shell { display: flex; flex-direction: column; gap: 14px; }
    .war-titlebar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .war-badge { display: inline-flex; align-items: center; width: fit-content; padding: 4px 8px; border-radius: 999px; background: rgba(0,240,255,0.12); color: var(--cyan); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; border: 1px solid rgba(0,240,255,0.22); }
    .war-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .war-tab { border: 1px solid rgba(94,234,212,0.2); background: rgba(255,255,255,0.03); color: var(--text); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .war-tab.active { background: rgba(0,240,255,0.14); color: var(--cyan); border-color: rgba(0,240,255,0.3); }
    .war-pane.hidden { display: none; }
    .war-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(94,234,212,0.18); border-radius: 12px; padding: 14px; }
    .war-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .war-kpi { background: rgba(0,240,255,0.08); border: 1px solid rgba(0,240,255,0.16); border-radius: 10px; padding: 10px 12px; }
    .war-kpi span { display: block; color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .war-kpi strong { display: block; margin-top: 4px; font-size: 0.98rem; color: var(--text); }
    .war-list { display: grid; gap: 8px; }
    .war-list-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); color: var(--muted); }
    .war-list-item strong { color: var(--text); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(2,6,23,0.8); z-index: 20; padding: 20px; }
    .modal.open { display: flex; align-items: center; justify-content: center; }
    .modal-card { width: min(900px, 100%); max-height: 80vh; overflow: auto; background: var(--panel); border: 1px solid rgba(94,234,212,0.25); border-radius: 14px; padding: 16px; box-shadow: 0 0 24px rgba(0,240,255,0.16); }
    .modal-card h3 { margin-top: 0; color: var(--accent); }
    .modal-card pre { white-space: pre-wrap; word-break: break-word; background: rgba(255,255,255,0.04); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); color: var(--text); font-size: 0.8rem; }
    .modal-close { float: right; background: transparent; border: 0; color: var(--cyan); cursor: pointer; font-size: 1rem; }
  </style>

    (function(){
      // Best-effort: increase EventEmitter default listeners if available in this context
      try{
        const EventEmitter = (typeof require === 'function' && require('events') && require('events').EventEmitter) || window.EventEmitter;
        if (EventEmitter && typeof EventEmitter.defaultMaxListeners === 'number') {
          EventEmitter.defaultMaxListeners = Math.max(50, EventEmitter.defaultMaxListeners || 10);
        }
      }catch(e){}

      // Silence noisy extension warnings locally (non-destructive). This only mutes specific console.warn messages.
      try{
        const _origWarn = console.warn.bind(console);
        console.warn = function(...args){
          try{
            const s = String(args[0] || '');
            if (s.includes('MaxListenersExceededWarning') || s.includes('ObjectMultiplex - orphaned data for stream')) {
              return; // drop this warning
            }
          }catch(e){}
          return _origWarn(...args);
        };
      }catch(e){}
    })();
  </script>
</head>

  <script>
    const API_KEY = '5bc5a81f4c67e52b148c';
    const NATION_ID = 768640;
    const TURNS_PER_DAY = 12;
    function formatNumber(value) { const num = Number(value); return Number.isFinite(num) ? num.toLocaleString() : '—'; }
    function formatDecimal(value, digits = 2) { const num = Number(value); return Number.isFinite(num) ? num.toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits }) : '—'; }
    function formatMoney(value) { const num = Number(value); return Number.isFinite(num) ? `$${num.toLocaleString(undefined, { maximumFractionDigits: 2 })}` : '—'; }
    function getTrendHistoryKey(city) {
      const id = String(city?.id || city?.city_id || '').trim();
      const name = String(city?.name || city?.city_name || '').trim();
      return id || name || 'unknown-city';
    }
    function getStoredTrendHistory() {
      try {
        const raw = localStorage.getItem('cities-hud-trend-history-v1');
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        return {};
      }
    }
    function openTrendLogModal() {
      const output = document.getElementById('trendLogOutput');
      const modal = document.getElementById('trendLogModal');
      if (!output || !modal) return;
      output.textContent = JSON.stringify(getStoredTrendHistory(), null, 2);
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }
    function closeTrendLogModal() {
      const modal = document.getElementById('trendLogModal');
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }
    function saveTrendHistory(history) {
      try {
        localStorage.setItem('cities-hud-trend-history-v1', JSON.stringify(history));
      } catch (error) {
        // ignore storage errors
      }
    }
    function updateTrendHistory(cityData) {
      const history = getStoredTrendHistory();
      cityData.forEach((city) => {
        const key = getTrendHistoryKey(city);
        const existing = Array.isArray(history[key]) ? history[key] : [];
        history[key] = [...existing, {
          ts: Date.now(),
          grossProfit: Number(city.grossProfit || 0),
          netProfit: Number(city.profit || 0),
          commerceIncome: Number(city.commerceIncome || 0)
        }].slice(-24);
      });
      saveTrendHistory(history);
      return history;
    }
    function getTrendProjection(history) {
      const points = Array.isArray(history) ? history : [];
      if (points.length < 2) return { label: '—', direction: 'neutral', pct: 0 };
      const values = points.map((point) => Number(point.grossProfit || 0)).filter(Number.isFinite);
      if (values.length < 2) return { label: '—', direction: 'neutral', pct: 0 };
      const first = values[0];
      const last = values[values.length - 1];
      // guard against zero or non-finite values to avoid division by zero producing Infinity
      if (!Number.isFinite(first) || !Number.isFinite(last) || Math.abs(last) < 1e-12) return { label: '—', direction: 'neutral', pct: 0 };
      const delta = (last - first) / Math.max(1, values.length - 1);
      const projected = last + delta;
      const pct = ((projected - last) / Math.abs(last)) * 100;
      const direction = pct > 0.5 ? 'up' : pct < -0.5 ? 'down' : 'flat';
      const roundedPct = Math.abs(pct) < 1 ? Math.round(pct * 1000) / 1000 : Math.round(pct * 1000) / 1000;
      const label = `${pct >= 0 ? '+' : ''}${roundedPct.toFixed(3)}%`;
      return { label, direction, pct };
    }
    function buildSparklineSvg(history, width = 72, height = 22, color = '#4ade80') {
      const points = Array.isArray(history) ? history : [];
      const values = points.map((point) => Number(point.grossProfit || 0)).filter(Number.isFinite);
      const padding = 2;
      if (values.length < 2) {
        return `<svg class="city-trend-spark" viewBox="0 0 ${width} ${height}" aria-label="trend"><line x1="${padding}" y1="${height / 2}" x2="${width - padding}" y2="${height / 2}" stroke="rgba(125,140,168,0.45)" stroke-width="1.6" stroke-linecap="round" /></svg>`;
      }
      const min = Math.min(...values);
      const max = Math.max(...values);
      const safeMax = max === min ? max + 1 : max;
      const coords = values.map((value, index) => {
        const x = padding + (index / Math.max(1, values.length - 1)) * (width - padding * 2);
        const normalized = max === min ? 0.5 : (value - min) / (safeMax - min);
        const y = padding + (1 - normalized) * (height - padding * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `<svg class="${width === 72 ? 'city-trend-spark' : 'group-trend-spark'}" viewBox="0 0 ${width} ${height}" aria-label="sparkline"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
    }
    function renderCityNameCell(city, history) {
      const projection = getTrendProjection(history || []);
      const trendColor = projection.direction === 'up' ? '#4ade80' : projection.direction === 'down' ? '#f87171' : '#7d8ca8';
      const sparkline = buildSparklineSvg(history || []);
      const cityLabel = city?.name || 'Unnamed City';
      return `<td><div class="city-name-stack"><div class="city-trend-meta"><span class="city-trend-badge" style="color:${trendColor}">${projection.label}</span>${sparkline}</div><div class="city-name"><a class="city-link" href="city-details.html?cityId=${encodeURIComponent(city.id || '')}&cityName=${encodeURIComponent(cityLabel)}">${cityLabel}</a></div></div></td>`;
    }
    function renderGroupHeader(groupName, history) {
      const projection = getTrendProjection(history || []);
      const trendColor = projection.direction === 'up' ? '#4ade80' : projection.direction === 'down' ? '#f87171' : '#7d8ca8';
      const sparkline = buildSparklineSvg(history || [], 68, 18, trendColor);
      return `<span class="group-trend"><span class="group-trend-badge" style="color:${trendColor}">${projection.label}</span>${sparkline}</span>`;
    }
    function getCappedBonusMultiplier(count, maxCount, maxBonus = 0.5) {
      const safeCount = Math.min(Math.max(Number(count) || 0, 0), maxCount);
      if (!Number.isFinite(safeCount) || maxCount <= 0) return 1;
      return 1 + (safeCount / maxCount) * maxBonus;
    }
    function getCappedBonusOutput(baseOutput, count, maxCount, maxBonus = 0.5) {
      return Number(baseOutput) * getCappedBonusMultiplier(count, maxCount, maxBonus);
    }
    function getDailyOutput(baseOutput, count, maxCount, maxBonus = 0.5) {
      return getCappedBonusOutput(baseOutput, count, maxCount, maxBonus) * 12;
    }
    function getSupermarketDailyProfit(population, count = 1) {
      const referencePopulation = 169454;
      const referenceRevenue = 19656.63;
      const safePopulation = Math.max(Number(population) || 0, 0);
      const revenuePerBuilding = referenceRevenue * (safePopulation / referencePopulation);
      const profitPerBuilding = revenuePerBuilding - 600;
      return Number(count || 0) * profitPerBuilding;
    }
    function getCommerceIncome(population, buildingCommerce, baseIncome = 1.0, commerceMultiplier = 0.05, crimePenalty = 0) {
      const safePopulation = Math.max(Number(population) || 0, 0);
      const safeBuildingCommerce = Number(buildingCommerce || 0);
      return safePopulation > 0 ? safePopulation * (baseIncome + safeBuildingCommerce * commerceMultiplier) * (1 - crimePenalty) : 0;
    }
    function normalizeText(value) {
      return String(value || '')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s*\d+\s*days?/gi, '')
        .replace(/[^a-z0-9 ]+/gi, ' ')
        .trim()
        .toLowerCase();
    }
    function getSheetRows(data) {
      const cols = data?.table?.cols || [];
      return (data?.table?.rows || []).map((row) => ({
        cells: (row?.c || []).map((cell) => {
          if (!cell) return '';
          if (typeof cell.v === 'number' || typeof cell.v === 'boolean') return cell.v;
          return String(cell.v || '').trim();
        }),
        headers: cols.map((col) => String(col.label || '').trim())
      }));
    }
    function getCityPopulationFromSheet(cityName, sheetRows) {
      const normalizedCity = normalizeText(cityName || '');
      const populationRow = sheetRows.find((row) => normalizeText(row.cells[1]) === 'population');
      const headerRow = sheetRows.length > 0 ? sheetRows[0].headers : [];
      if (!populationRow || !headerRow.length) return null;
      const columnIndex = headerRow.findIndex((label, index) => index > 1 && normalizeText(label).includes(normalizedCity));
      if (columnIndex < 0) {
        const fallbackIndex = headerRow.findIndex((label, index) => index > 1 && normalizeText(label) === normalizedCity);
        if (fallbackIndex >= 0) return Number(populationRow.cells[fallbackIndex]) || null;
        return null;
      }
      return Number(populationRow.cells[columnIndex]) || null;
    }
    async function fetchCityPopulationMap(cityNames) {
      const SHEET_ID = '1KlXsnU_OEzTpefr3bPHqs8YAT3MlqaT3X-ITxrIE6ys';
      const SHEET_GID = '1972996458';
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=out:json&range=A1:Z50`;
      const response = await fetch(url);
      const text = await response.text();
      const match = text.match(/google\.visualization\.Query\.setResponse\(([^]+)\);?/);
      if (!match) return new Map();
      const data = JSON.parse(match[1]);
      const rows = getSheetRows(data);
      const entries = cityNames.map((name) => [normalizeText(name || ''), getCityPopulationFromSheet(name, rows)]);
      return new Map(entries.filter(([, population]) => Number.isFinite(Number(population))));
    }
    async function fetchCitySheetStats() {
      const SHEET_ID = '1KlXsnU_OEzTpefr3bPHqs8YAT3MlqaT3X-ITxrIE6ys';
      const SHEET_GID = '1972996458';
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=out:json&range=A1:Z50`;
      try {
        const text = await fetch(url).then(response => response.text());
        const match = text.match(/google\.visualization\.Query\.setResponse\(([^]+)\);?/);
        if (!match) return {};
        const data = JSON.parse(match[1]);
        const rows = getSheetRows(data);
        const headers = rows[0]?.headers || [];
        const fields = { infrastructure:'infrastructure', land:'land', population:'city_population', disease:'disease', crime:'crime', pollution:'pollution', commerce:'sheetCommerce', 'coal power plant':'coal_power', 'oil power plant':'oil_power', 'nuclear power plant':'nuclear_power', 'wind power plant':'wind_power', 'iron mine':'iron_mine', 'oil well':'oil_well', 'coal mine':'coal_mine', 'bauxite mine':'bauxite_mine', 'lead mine':'lead_mine', 'uranium mine':'uranium_mine', farm:'farm', 'oil refinery':'oil_refinery', 'steel mill':'steel_mill', 'aluminum refinery':'aluminum_refinery', 'munitions factory':'munitions_factory', 'police station':'police_station', hospital:'hospital', 'recycling center':'recycling_center', subway:'subway', supermarket:'supermarket', bank:'bank', 'shopping mall':'shopping_mall', stadium:'stadium', barracks:'barracks', factory:'factory', hangar:'hangar', drydock:'drydock' };
        return rows.reduce((cities, row) => {
          const field = fields[normalizeText(row.cells[1])];
          if (!field) return cities;
          headers.forEach((header, index) => {
            if (index > 1 && header) (cities[normalizeText(header)] ||= {})[field] = Number(row.cells[index]) || 0;
          });
          return cities;
        }, {});
      } catch (error) {
        console.warn('City Sheet stats unavailable.', error);
        return {};
      }
    }
    function getFacilityProfiles() {
      return {
        farm: { label: 'Farm', output: 0, upkeep: 300, resource: 'food', dynamicOutput: city => getCappedBonusOutput(Number(city.land || 0) / 500, Number(city.farm || 0), 20), operatingCost: 300, description: 'Farms produce food equal to land / 500 per farm (about 4.98 food/turn at current land) and can be built up to 20 per city. Output increases via a capped bonus that reaches +50% at 20 farms.' },
        supermarket: { label: 'Supermarket', output: 0, upkeep: 2, resource: null, operatingCost: 600, description: 'Supermarkets increase commerce by 4% per building and can be built up to 4 per city. They do not affect the pollution index.' },
        bank: { label: 'Bank', output: 0, upkeep: 2, resource: null, operatingCost: 0, description: 'Banks increase commerce and do not directly produce steel.' },
        stadium: { label: 'Stadium', output: 0, upkeep: 2, resource: null, operatingCost: 0, description: 'Stadiums drive event revenue but do not directly produce steel.' },
        iron_mine: { label: 'Iron Mine', output: 0.25, upkeep: 3, resource: 'iron', dynamicOutput: city => getCappedBonusOutput(0.25, Number(city.iron_mine || 0), 10), operatingCost: 1600, description: 'Iron mines produce 0.25 tons of iron per turn (3 tons/day) and can be built up to 10 per city. Output increases via a capped bonus that reaches +50% at 10 mines.' },
        coal_mine: { label: 'Coal Mine', output: 0.25, upkeep: 2, resource: 'coal', dynamicOutput: city => getCappedBonusOutput(0.25, Number(city.coal_mine || 0), 10), operatingCost: 400, description: 'Coal mines produce 0.25 tons of coal per turn (3 tons/day) and can be built up to 10 per city. Output increases via a capped bonus that reaches +50% at 10 mines.' },
        lead_mine: { label: 'Lead Mine', output: 0.25, upkeep: 2, resource: 'lead', dynamicOutput: city => getCappedBonusOutput(0.25, Number(city.lead_mine || 0), 10), operatingCost: 1200, description: 'Lead mines produce 0.25 tons of lead per turn (3 tons/day) and can be built up to 10 per city. Output increases via a capped bonus that reaches +50% at 10 mines.' },

    // small helpers to guard against bad data
    function safeNumber(v, fallback=0){ const n = Number(v); return Number.isFinite(n)?n:fallback; }
    const MAX_BUILDING_CAP = 10000; // hard cap to avoid runaway values from bad data
    const OPERATING_COSTS = {
      coal_power: 120, oil_power: 180, nuclear_power: 10500, wind_power: 500,
      farm: 300, supermarket: 600, bank: 1800, stadium: 12150, shopping_mall: 5400, subway: 3250,

    function calculateCityUpkeep(city) {
      return Object.entries(OPERATING_COSTS).reduce((sum, [building, cost]) => {
        const safeCount = Math.min(safeNumber(city[building], 0), MAX_BUILDING_CAP);
        return sum + safeCount * cost;
      }, 0);
    }
    function calculateNetProfit(city, priceMap, population = 0) {
      const facilities = getCityFacilities(city);
      // compute per-facility totals with safety
      const facilityDetails = [];
      const totalProduction = facilities.reduce((sum, [, count, profile]) => {
        const safeCount = Math.min(safeNumber(count,0), MAX_BUILDING_CAP);
        const perTurn = safeNumber(getFacilityOutput(city, profile),0);
        const price = safeNumber(priceMap[profile.resource],0);
        const dailyProduction = safeCount * perTurn * 12;
        const revenue = dailyProduction * price;
        facilityDetails.push({ name: profile.label || 'unknown', count: safeCount, perTurn, dailyProduction, price, revenue, upkeepPer: safeNumber(profile.operatingCost ?? profile.upkeep ?? 0,0) });
        return sum + revenue;
      }, 0);
      const totalUpkeep = calculateCityUpkeep(city);
      const inputCost =
        safeNumber(city.steel_mill, 0) * 12 * (safeNumber(priceMap.iron, 0) + safeNumber(priceMap.coal, 0)) +
        safeNumber(city.oil_refinery, 0) * 12 * safeNumber(priceMap.oil, 0) +
        safeNumber(city.aluminum_refinery, 0) * 12 * safeNumber(priceMap.bauxite, 0) +
        safeNumber(city.munitions_factory, 0) * 12 * safeNumber(priceMap.lead, 0);
      const powerInputCost =
        safeNumber(city.oil_power, 0) * safeNumber(city.infrastructure, 0) * 0.001 * 12 * safeNumber(priceMap.oil, 0) +
        safeNumber(city.nuclear_power, 0) * safeNumber(city.infrastructure, 0) * 0.00025 * 12 * safeNumber(priceMap.uranium, 0);
      const populationInputCost =
        safeNumber(population, 0) * (662.24 / 4186213 * safeNumber(priceMap.food, 0) + 26.63 / 4186213 * safeNumber(priceMap.coal, 0) + 70.25 / 4186213 * safeNumber(priceMap.oil, 0) + 26.63 / 4186213 * safeNumber(priceMap.iron, 0)) * 12;
      const commerceRate = Math.min(100, safeNumber(city.supermarket, 0) * 4 + safeNumber(city.bank, 0) * 6 + safeNumber(city.shopping_mall, 0) * 8 + safeNumber(city.stadium, 0) * 10 + safeNumber(city.subway, 0) * 8);
      const cityIncome = (((commerceRate / 50) * 0.725) + 0.725) * safeNumber(population, 0);
      const commerceIncome = cityIncome * (1 - Math.min(1, Math.max(0, safeNumber(city.crime, 0)))) * (1 - Math.min(1, Math.max(0, safeNumber(city.disease, 0))));
      const net = totalProduction + commerceIncome - totalUpkeep - inputCost - powerInputCost - populationInputCost;
      // targeted debug for MonopolyGO
      try{
        const cityName = String(city?.name || city?.city_name || '').trim();
        if(normalizeText(cityName) === 'monopolygo'){
          console.group('MonopolyGO calculateNetProfit');

          console.table(facilityDetails);

          console.groupEnd();
        }
      }catch(e){ console.warn('MonopolyGO debug failed', e); }
      // ensure numeric return
      if(!Number.isFinite(net)) return { net: 0, grossRevenue: 0, commerceIncome: 0 };
      return { net, grossRevenue: totalProduction + commerceIncome, commerceIncome };
    }
    function calculateGroupProfit(city, priceMap, groupKey, population = 0) {
      const profiles = getFacilityProfiles();

      const facilities = groupFacilities[groupKey] || [];

      const totalUpkeep = facilities.reduce((sum, [, count, profile]) => {
        const building = Object.entries(getFacilityProfiles()).find(([, candidate]) => candidate === profile)?.[0];
        return sum + Number(count) * (OPERATING_COSTS[building] || 0);

      const supermarketProfit = getSupermarketDailyProfit(population, Number(city.supermarket || 0));
      return totalProduction - totalUpkeep + (groupKey === 'Food' ? supermarketProfit : 0);
    }

            if (groupKey === 'Munitions') extraCells = `<td>${formatDecimal(city.munitionsOutputPerFactory)}</td><td>${formatDecimal(city.totalMunitions)}</td>`;
            if (groupKey === 'Oil') extraCells = `<td>${formatDecimal(city.gasolineOutputPerRefinery)}</td><td>${formatDecimal(city.totalGasoline)}</td>`;
            if (groupKey === 'Uranium') extraCells = `<td>${formatDecimal(city.uraniumOutputPerMine)}</td><td>${formatDecimal(city.totalUranium)}</td>`;
            if (groupKey === 'Iron') extraCells = `<td>${formatDecimal(city.ironOutputPerMine)}</td><td>${formatDecimal(city.totalIron)}</td>`;
            if (groupKey === 'Coal') extraCells = `<td>${formatDecimal(city.coalOutputPerMine)}</td><td>${formatDecimal(city.totalCoal)}</td>`;
            if (groupKey === 'Lead') extraCells = `<td>${formatDecimal(city.leadOutputPerMine)}</td><td>${formatDecimal(city.totalLead)}</td>`;
            if (groupKey === 'Bauxite') extraCells = `<td>${formatDecimal(city.bauxiteOutputPerMine)}</td><td>${formatDecimal(city.totalBauxite)}</td>`;
            const cityCell = renderCityNameCell(city, trendHistoryMap[getTrendHistoryKey(city)]);
            const netProfitCell = city.calcError ? `<span style="color:#ffb86b;font-weight:700">Error</span>` : formatMoney(city.profit);
            return `<tr>${cityCell}<td>${formatMoney(city.groupProfit)}</td><td>${netProfitCell}</td><td>${formatNumber(city.infrastructure || 0)}</td><td>${city.powered ? 'Online' : 'Offline'}</td><td>${formatNumber(city.land || 0)}</td><td>${city.powered ? 'Powered' : 'Unpowered'}</td>${extraCells}</tr>`;
          }).join('');
          const headerExtra = groupKey === 'Food' ? '<th>Farm Output</th><th>Total Food</th>' :
                              groupKey === 'Steel' ? '<th>Mill Output</th><th>Total Steel</th>' :
                              groupKey === 'Aluminum' ? '<th>Refinery Output</th><th>Total Aluminum</th>' :
                              groupKey === 'Munitions' ? '<th>Factory Output</th><th>Total Munitions</th>' :
                              groupKey === 'Oil' ? '<th>Refinery Output</th><th>Total Gasoline</th>' :
                              groupKey === 'Uranium' ? '<th>Mine Output</th><th>Total Uranium</th>' :
                              groupKey === 'Iron' ? '<th>Mine Output</th><th>Total Iron</th>' :
                              groupKey === 'Coal' ? '<th>Mine Output</th><th>Total Coal</th>' :
                              groupKey === 'Lead' ? '<th>Mine Output</th><th>Total Lead</th>' :
                              groupKey === 'Bauxite' ? '<th>Mine Output</th><th>Total Bauxite</th>' : '';
          const borderStyle = isTopProfit ? 'border: 1px solid #facc15; box-shadow: 0 0 0 1px rgba(250,204,21,0.25), 0 0 18px rgba(250,204,21,0.15);' : '';
          const groupHistory = items.map(city => trendHistoryMap[getTrendHistoryKey(city)] || []).flat();
          const groupHeader = renderGroupHeader(groupName, groupHistory);
          return `<div class="group" style="${borderStyle}"><h3>${groupName} <span style="color:#4ade80">${formatMoney(groupProfit)}</span>${groupHeader}</h3><table><thead><tr><th>City</th><th>${groupName} Profit</th><th>Infrastructure</th><th>Status</th><th>Land</th><th>Power</th>${headerExtra}</tr></thead><tbody>${rows}</tbody></table></div>`;
        };
        const sectionData = [
          ['Steel Goods', 'Steel', manufacturedGroups.Steel],
          ['Munitions', 'Munitions', manufacturedGroups.Munitions],
          ['Aluminum Goods', 'Aluminum', manufacturedGroups.Aluminum],
          ['Iron Goods', 'Iron', manufacturedGroups.Iron],
          ['Coal Goods', 'Coal', manufacturedGroups.Coal],
          ['Lead Goods', 'Lead', manufacturedGroups.Lead],
          ['Bauxite Goods', 'Bauxite', manufacturedGroups.Bauxite],
          ['Oil Goods', 'Oil', manufacturedGroups.Oil],
          ['Uranium Goods', 'Uranium', manufacturedGroups.Uranium],
          ['Food Goods', 'Food', manufacturedGroups.Food]
        ].map(([name, key, items]) => ({ name, key, items, profit: items.reduce((sum, city) => sum + Number(city.groupProfit || 0), 0) })).sort((a, b) => b.profit - a.profit);
        const topProfitValue = sectionData[0]?.profit || 0;
        const totalGrossProfit = cityData.reduce((sum, city) => sum + Number(city.grossProfit || 0), 0);
        const totalUpkeep = cityData.reduce((sum, city) => sum + Number(city.upkeep || 0), 0);
        const overallHistory = Object.values(trendHistoryMap).flat();
        const overallProjection = getTrendProjection(overallHistory);
        const overallTrendColor = overallProjection.direction === 'up' ? '#4ade80' : overallProjection.direction === 'down' ? '#f87171' : '#7d8ca8';
        const overallSpark = buildSparklineSvg(overallHistory, 90, 22, overallTrendColor);
        const totalRow = `<div>Total Gross Profit: ${formatMoney(totalGrossProfit)}<br>Total Commerce Income: ${formatMoney(totalCommerceIncome)}<br>Total Upkeep: ${formatMoney(-totalUpkeep)}<br>Total Net Profit: ${formatMoney(totalNetProfit)}<br>Infrastructure: ${formatNumber(totalInfrastructure)} • Land: ${formatNumber(totalLand)}</div><div class="summary-trend"><span class="summary-trend-badge" style="color:${overallTrendColor}">${overallProjection.label}</span>${overallSpark}</div>`;
        const sectionMarkup = sectionData.map(({ name, key, items, profit }) => buildTable(name, key, items, profit === topProfitValue && profit > 0)).join('');
        const overviewCards = `<div class="war-grid"><div class="war-kpi"><span>Net Profit</span><strong>${formatMoney(totalNetProfit)}</strong></div><div class="war-kpi"><span>Gross Profit</span><strong>${formatMoney(totalGrossProfit)}</strong></div><div class="war-kpi"><span>Commerce Income</span><strong>${formatMoney(totalCommerceIncome)}</strong></div><div class="war-kpi"><span>Total Upkeep</span><strong>${formatMoney(-totalUpkeep)}</strong></div><div class="war-kpi"><span>Infrastructure</span><strong>${formatNumber(totalInfrastructure)}</strong></div></div>`;
        const groupHighlights = `<div class="war-list">${sectionData.slice(0, 6).map(({ name, profit }) => `<div class="war-list-item"><span>${name}</span><strong>${formatMoney(profit)}</strong></div>`).join('')}</div>`;

        // All Cities table with dominant resource icon and gross profit ranking
        const allRows = cityData.map(city => {
          const icon = city.dominantIcon ? `<img src="${city.dominantIcon}" alt="${city.dominantResource}" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;border-radius:3px;">` : '';
          const upkeep = Number(city.upkeep || 0);
          const cityCell = renderCityNameCell(city, trendHistoryMap[getTrendHistoryKey(city)]);
          const netProfitCell = city.calcError ? `<span style="color:#ffb86b;font-weight:700">Error</span>` : formatMoney(city.profit);
          return `<tr>${cityCell.replace('<td>', `<td>${icon}`)}<td>${formatMoney(city.grossProfit)}</td><td>${netProfitCell}</td><td>${formatMoney(city.commerceIncome)}</td><td>${formatMoney(-upkeep)}</td><td>${formatNumber(city.infrastructure || 0)}</td><td>${city.powered ? 'Online' : 'Offline'}</td></tr>`;
        }).join('');
        const allCitiesTable = `<div class="group"><h3>All Cities by Gross Profit</h3><table><thead><tr><th>City</th><th>Gross Profit</th><th>Net Profit</th><th>Commerce Income (est)</th><th>Total Upkeep</th><th>Infrastructure</th><th>Status</th></tr></thead><tbody>${allRows}</tbody></table></div>`;

        document.getElementById('summary').innerHTML = totalRow;
        document.getElementById('content').innerHTML = `${overviewCards}${allCitiesTable}${sectionMarkup}`;
        document.getElementById('groupsContent').innerHTML = `<div class="war-card"><h3>Resource Group Highlights</h3>${groupHighlights}</div>`;
      } catch (error) {
        document.getElementById('content').innerHTML = `<p>${error.message}</p>`;
      } finally {
        loadInFlight = false;
      }
    }
    function activateWarTab(tabName) {
      document.querySelectorAll('.war-tab').forEach((button) => {
        const isActive = button.dataset.warTab === tabName;
        button.classList.toggle('active', isActive);
      });
      document.querySelectorAll('.war-pane').forEach((pane) => {
        pane.classList.toggle('hidden', pane.id !== `${tabName === 'groups' ? 'warGroupsPane' : 'warOverviewPane'}`);
      });
    }
    document.querySelectorAll('.war-tab').forEach((button) => {
      button.addEventListener('click', () => activateWarTab(button.dataset.warTab));
    });
    document.getElementById('openCitiesListBtn').addEventListener('click', () => {
      window.open('cities-list.html', '_blank');
    });
    document.getElementById('viewTrendLogBtn').addEventListener('click', openTrendLogModal);
    document.getElementById('closeTrendLogBtn').addEventListener('click', closeTrendLogModal);
    document.getElementById('trendLogModal').addEventListener('click', (event) => {
      if (event.target.id === 'trendLogModal') closeTrendLogModal();
    });
    loadData();
    setInterval(loadData, 60 * 1000);
  </script>
</body>
</html>
