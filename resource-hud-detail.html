<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Resource HUD Detail</title>
	<style>body{font-family:Arial,Helvetica,sans-serif;background:#050816;color:#e6f7fb;margin:0;padding:24px}a.back{color:#00f0ff;text-decoration:none;display:inline-block;margin-bottom:12px}.panel{background:#0e1428;padding:18px;border-radius:10px;border:1px solid rgba(0,240,255,0.08)}</style>
</head>
<body>
	<a class="back" href="DASHBOARD.HTML">← Back to Dashboard</a>
	<div class="panel">
		<h1>Resource HUD Detail</h1>
		<div id="content">Select a resource from the dashboard to see detail here.</div>
	</div>
	<script src="common.js"></script>
	<script>
		// This page expects a query parameter ?resource=name
		function param(name){const u=new URLSearchParams(location.search);return u.get(name);} 
        const resource = param('resource');
        if (resource) {
            location.replace(`resource-detail.html?resource=${encodeURIComponent(resource)}`);
        } else {
            document.getElementById('content').innerHTML = `<div><strong>Resource:</strong> unavailable</div><div style="margin-top:8px;color:#94a3b8">Open a stockpile resource from the dashboard to view detailed market data.</div>`;
        }
