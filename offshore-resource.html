<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Offshore Resource Insight</title>
	<style>
		:root{--bg:#07110f;--panel:#0d1d19;--line:#285344;--text:#edf7ef;--muted:#91b2a1;--gold:#e8c878;--green:#62d39b;--red:#f28b7d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,#183b2f,transparent 35%),linear-gradient(135deg,#07110f,#101e18);color:var(--text);font:15px/1.5 Georgia,serif}.wrap{max-width:980px;margin:auto;padding:32px 20px}.eyebrow{color:var(--gold);font:700 11px monospace;letter-spacing:.16em;text-transform:uppercase}.back{color:var(--gold);font:12px monospace;text-decoration:none}.hero{padding:48px 0 28px;border-bottom:1px solid var(--line)}h1{margin:8px 0;font-size:clamp(2.5rem,7vw,5rem);font-weight:400}.muted,.empty{color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.fact{padding:16px;background:rgba(13,29,25,.85);border:1px solid var(--line);border-radius:6px}.fact label{display:block;color:var(--muted);font:11px monospace;text-transform:uppercase}.fact strong{display:block;margin-top:6px;color:var(--green);font:700 1.35rem monospace}.table-wrap{overflow:auto;background:rgba(13,29,25,.85);border:1px solid var(--line);border-radius:6px}table{width:100%;min-width:650px;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid rgba(40,83,68,.6)}th{color:var(--gold);font:11px monospace;text-transform:uppercase}td{color:#d7e8da}.in{color:var(--green)}.out{color:var(--red)}@media(max-width:700px){.facts{grid-template-columns:1fr 1fr}}
	</style>
</head>
<body><main class="wrap">
	<a class="back" href="offshore-anris-cute-cat-cafe.html">← Offshore tracker</a>
	<section class="hero"><div class="eyebrow">Individual RSS insight</div><h1 id="title">Loading resource...</h1><p class="muted">Every recorded turn change affecting this resource in the Anri offshore account.</p></section>
	<section class="facts"><div class="fact"><label>Current offshore units</label><strong id="units">--</strong></div><div class="fact"><label>Live market value</label><strong id="value">$0</strong></div><div class="fact"><label>Net unit change</label><strong id="net">--</strong></div></section>
	<div class="table-wrap"><table><thead><tr><th>Turn / date</th><th>Direction</th><th>Unit change</th><th>Running units</th><th>Note</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading turn history...</td></tr></tbody></table></div>
	<script>
		const KEY='6d6a8d4c6138245a70b4', OFFSHORE=15086, BARROWS=15572, resources=['food','coal','oil','uranium','iron','bauxite','lead','gasoline','munitions','steel','aluminum'], labels={food:'Food',coal:'Coal',oil:'Oil',uranium:'Uranium',iron:'Iron',bauxite:'Bauxite',lead:'Lead',gasoline:'Gasoline',munitions:'Munitions',steel:'Steel',aluminum:'Aluminum'}, resource=new URLSearchParams(location.search).get('resource');
		const $=id=>document.getElementById(id), number=v=>(Number(v)||0).toLocaleString(undefined,{maximumFractionDigits:2}), money=v=>`$${Math.round(Number(v)||0).toLocaleString()}`, esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
		async function api(query){const response=await fetch(`https://api.politicsandwar.com/graphql?api_key=${KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query}),cache:'no-store'});const json=await response.json();if(!response.ok||json.errors?.length)throw new Error(json.errors?.[0]?.message||`HTTP ${response.status}`);return json.data}
		async function load(){if(!resources.includes(resource))throw new Error('Unknown resource selected.');$('title').textContent=labels[resource];const records=[];for(let page=1;page<=10;page++){const data=await api(`{ bankrecs(first:100,page:${page},or_id:[${OFFSHORE},${BARROWS}]){data{id date sender_id receiver_id ${resource} note}}}`),batch=data?.bankrecs?.data||[];records.push(...batch.filter(r=>(Number(r.sender_id)===BARROWS&&Number(r.receiver_id)===OFFSHORE)||(Number(r.sender_id)===OFFSHORE&&Number(r.receiver_id)===BARROWS)));if(batch.length<100)break}const prices=await api('{ tradeprices(first:100){data{date '+resource+'}}}'),price=(prices?.tradeprices?.data||[]).sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0))[0]?.[resource]||0;let running=0;const ordered=records.slice().sort((a,b)=>(Date.parse(a.date)||0)-(Date.parse(b.date)||0));$('rows').innerHTML=ordered.map(r=>{const incoming=Number(r.receiver_id)===OFFSHORE,change=(incoming?1:-1)*(Number(r[resource])||0);running+=change;return `<tr><td>${esc(r.date?new Date(r.date).toLocaleString():'Unknown')}</td><td class="${incoming?'in':'out'}">${incoming?'Received':'Returned'}</td><td class="${change>=0?'in':'out'}">${change>=0?'+':''}${number(change)}</td><td>${number(running)}</td><td>${esc(r.note||'No note')}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No turn changes found.</td></tr>';$('units').textContent=number(running);$('net').textContent=(running>=0?'+':'')+number(running);$('value').textContent=money(running*price)}load().catch(error=>{$('rows').innerHTML=`<tr><td colspan="5" class="empty">${esc(error.message)}</td></tr>`});
	</script>
</main></body>
</html>
