<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Offshore Growth</title>
	<style>
		:root{--bg:#07110f;--panel:#0d1d19;--line:#285344;--text:#edf7ef;--muted:#91b2a1;--gold:#e8c878;--green:#62d39b;--red:#f28b7d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,#183b2f,transparent 35%),linear-gradient(135deg,#07110f,#101e18);color:var(--text);font:15px/1.5 Georgia,serif}.wrap{max-width:1180px;margin:auto;padding:32px 20px}.eyebrow{color:var(--gold);font:700 11px monospace;letter-spacing:.16em;text-transform:uppercase}.back{color:var(--gold);font:12px monospace;text-decoration:none}.hero{padding:48px 0 28px;border-bottom:1px solid var(--line)}h1{margin:8px 0;font-size:clamp(2.5rem,7vw,5rem);font-weight:400}.muted,.empty{color:var(--muted)}.table-wrap{overflow:auto;background:rgba(13,29,25,.85);border:1px solid var(--line);border-radius:6px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid rgba(40,83,68,.6)}th{color:var(--gold);font:11px monospace;text-transform:uppercase}td{color:#d7e8da}.in{color:var(--green)}.out{color:var(--red)}
	</style>
</head>
<body><main class="wrap"><a class="back" href="offshore-anris-cute-cat-cafe.html">← Offshore tracker</a><section class="hero"><div class="eyebrow">Turn-by-turn account history</div><h1>Offshore Growth</h1><p class="muted">A live audit log of every RSS unit change in the Anri offshore account. Positive changes are Barrows deposits; negative changes are returns.</p></section><div class="table-wrap"><table><thead><tr><th>Turn / date</th><th>Resource</th><th>Direction</th><th>Unit change</th><th>Running units</th><th>Cash change</th><th>Note</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Loading turn changes...</td></tr></tbody></table></div>
	<script>
		const KEY='6d6a8d4c6138245a70b4',OFFSHORE=15086,BARROWS=15572,resources=['food','coal','oil','uranium','iron','bauxite','lead','gasoline','munitions','steel','aluminum'],labels={food:'Food',coal:'Coal',oil:'Oil',uranium:'Uranium',iron:'Iron',bauxite:'Bauxite',lead:'Lead',gasoline:'Gasoline',munitions:'Munitions',steel:'Steel',aluminum:'Aluminum'},$=id=>document.getElementById(id),number=v=>(Number(v)||0).toLocaleString(undefined,{maximumFractionDigits:2}),money=v=>`$${Math.round(Number(v)||0).toLocaleString()}`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
		async function api(query){const response=await fetch(`https://api.politicsandwar.com/graphql?api_key=${KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query}),cache:'no-store'});const json=await response.json();if(!response.ok||json.errors?.length)throw new Error(json.errors?.[0]?.message||`HTTP ${response.status}`);return json.data}
		async function load(){const fields=resources.join(' '),records=[];for(let page=1;page<=10;page++){const data=await api(`{ bankrecs(first:100,page:${page},or_id:[${OFFSHORE},${BARROWS}]){data{id date sender_id receiver_id money ${fields} note}}}`),batch=data?.bankrecs?.data||[];records.push(...batch.filter(r=>(Number(r.sender_id)===BARROWS&&Number(r.receiver_id)===OFFSHORE)||(Number(r.sender_id)===OFFSHORE&&Number(r.receiver_id)===BARROWS)));if(batch.length<100)break}const running=Object.fromEntries(resources.map(r=>[r,0])),events=[];records.sort((a,b)=>(Date.parse(a.date)||0)-(Date.parse(b.date)||0)).forEach(r=>{const incoming=Number(r.receiver_id)===OFFSHORE,direction=incoming?'Received':'Returned';resources.forEach(resource=>{const change=(incoming?1:-1)*(Number(r[resource])||0);if(change){running[resource]+=change;events.push({date:r.date,resource,direction,change,running:running[resource],cash:(incoming?1:-1)*(Number(r.money)||0),note:r.note})}})});$('rows').innerHTML=events.reverse().map(e=>`<tr><td>${esc(e.date?new Date(e.date).toLocaleString():'Unknown')}</td><td>${labels[e.resource]}</td><td class="${e.change>=0?'in':'out'}">${e.direction}</td><td class="${e.change>=0?'in':'out'}">${e.change>=0?'+':''}${number(e.change)}</td><td>${number(e.running)}</td><td>${money(e.cash)}</td><td>${esc(e.note||'No note')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No turn changes found.</td></tr>'}load().catch(error=>{$('rows').innerHTML=`<tr><td colspan="7" class="empty">${esc(error.message)}</td></tr>`});
	</script></main></body></html>
