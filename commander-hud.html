<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Commander HUD</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;background:#050816;color:#e6f7fb;margin:0;padding:24px}a.back{color:#00f0ff;text-decoration:none;display:inline-block;margin-bottom:12px} .panel{background:#0e1428;padding:18px;border-radius:10px;border:1px solid rgba(0,240,255,0.08)}</style>
</head>
<body>
  <a class="back" href="DASHBOARD.HTML">← Back to Dashboard</a>
  <div class="panel">
    <h1>Commander HUD</h1>
    <div id="content">Loading commander profile…</div>
  </div>
  <script src="common.js"></script>
  <script>
    const NATION_ID = 768640;
    async function loadCommander(){
      try{
        const q = `query { nations(id: [${NATION_ID}], first:1) { data { leader_name nation_name num_cities population alliance_name alliance_id alliance_position } } }`;
        const r = await fetch(`https://api.politicsandwar.com/graphql?api_key=${window.API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
        const j = await r.json();
        const n = j?.data?.nations?.data?.[0];
        if(!n) throw new Error('No nation data returned');
        document.getElementById('content').innerHTML = `
          <div><strong>Executive:</strong> ${n.leader_name || 'Unknown'}</div>
          <div><strong>Nation:</strong> ${n.nation_name || 'Unknown'}</div>
          <div><strong>Cities:</strong> ${n.num_cities || 0}</div>
          <div><strong>Population:</strong> ${Number(n.population||0).toLocaleString()}</div>
          <div><strong>Alliance:</strong> ${n.alliance_name ? `${n.alliance_name} (ID ${n.alliance_id})` : (n.alliance_id?`ID ${n.alliance_id}`:'Independent')}</div>
          <div style="margin-top:8px;color:#94a3b8">Data source: Politics & War API</div>
        `;
      }catch(err){ document.getElementById('content').textContent = 'Error: '+err.message }
    }
    loadCommander();
  </script>
</body>
</html>
